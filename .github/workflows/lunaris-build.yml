
name: Lunaris AOSP Build - Beryllium

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build turi'
        required: true
        default: 'user'
        type: choice
        options:
          - user
          - userdebug
          - eng

jobs:
  build:
    # Faqat self-hosted runner: kamida 500GB disk, 32GB+ RAM tavsiya etiladi
    runs-on: [self-hosted, linux, aosp-builder]
    timeout-minutes: 1440  # 24 soat

    env:
      DEVICE: beryllium
      BRANCH: "16.2"
      LOCAL_BRANCH: "lineage-23.2"
      WORK_DIR: /srv/lunaris-build
      BUILD_TYPE: ${{ github.event.inputs.build_type }}

    steps:
      - name: Muhitni tekshirish
        run: |
          mkdir -p "$WORK_DIR"
          echo "Disk:"; df -h "$WORK_DIR"
          echo "RAM:"; free -h

      - name: Repo tool borligini tekshirish
        run: |
          if ! command -v repo &> /dev/null; then
            mkdir -p ~/bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Manifestni init qilish
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo init -u https://github.com/Lunaris-AOSP/android -b "$BRANCH" --git-lfs

      - name: Source sync
        working-directory: ${{ env.WORK_DIR }}
        run: |
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Eski/ziddiyatli papkalarni tozalash
        working-directory: ${{ env.WORK_DIR }}
        run: |
          rm -rf device/xiaomi/* vendor/xiaomi/* kernel/xiaomi/* hardware/xiaomi
          rm -rf hardware/qcom-caf/sm8250/* device/lineage/sepolicy \
                 device/qcom/sepolicy_vndr/legacy-um hardware/qcom-caf/common

      - name: Device/vendor/kernel treelarni klonlash
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -e
          git clone https://github.com/duckyduckG/android_device_xiaomi_beryllium_419.git -b "$LOCAL_BRANCH" --depth=1 device/xiaomi/beryllium
          git clone https://github.com/duckyduckG/android_device_xiaomi_sdm845-common_419.git -b "$LOCAL_BRANCH" --depth=1 device/xiaomi/sdm845-common
          git clone https://github.com/duckyduckG/android_vendor_xiaomi_beryllium_419.git -b "$LOCAL_BRANCH" --depth=1 vendor/xiaomi/beryllium
          git clone https://github.com/duckyduckG/android_vendor_xiaomi_sdm845-common_419.git -b "$LOCAL_BRANCH" --depth=1 vendor/xiaomi/sdm845-common
          git clone https://github.com/duckyduckG/android_kernel_xiaomi_sdm845_419.git -b "${LOCAL_BRANCH}_xiaomi" --depth=1 kernel/xiaomi/sdm845

          git clone https://github.com/LineageOS/android_hardware_xiaomi.git -b "$LOCAL_BRANCH" --depth=1 hardware/xiaomi
          git clone https://github.com/duckyduckG/android_hardware_qcom_media.git -b lineage-23.1-caf-sm8150 --depth=1 hardware/qcom-caf/sm8250/media
          git clone https://github.com/duckyduckG/android_hardware_qcom_audio.git -b lineage-23.2-caf-sm8250 --depth=1 hardware/qcom-caf/sm8250/audio
          git clone https://github.com/duckyduckG/android_hardware_qcom_display.git -b lineage-23.2-caf-sm8250 --depth=1 hardware/qcom-caf/sm8250/display
          git clone https://github.com/duckyduckG/android_device_lineage_sepolicy.git -b "$LOCAL_BRANCH" --depth=1 device/lineage/sepolicy
          git clone https://github.com/duckyduckG/android_device_qcom_sepolicy_vndr.git -b lineage-23.2-legacy-um --depth=1 device/qcom/sepolicy_vndr/legacy-um
          git clone https://github.com/duckyduckG/android_hardware_qcom-caf_common.git -b "$LOCAL_BRANCH" --depth=1 hardware/qcom-caf/common

      - name: ccache sozlash
        working-directory: ${{ env.WORK_DIR }}
        run: |
          export USE_CCACHE=1
          ccache -M 50G || true

      - name: Build va compile (bacon)
        working-directory: ${{ env.WORK_DIR }}
        run: |
          . build/envsetup.sh
          lunch "lineage_${DEVICE}-bp4a-${BUILD_TYPE}"
          export USE_CCACHE=1
          m bacon

      - name: Natijalarni ro'yxatlash
        working-directory: ${{ env.WORK_DIR }}
        run: |
          find "out/target/product/${DEVICE}" -maxdepth 1 -name "*.zip" -exec ls -lh {} \;

      - name: Artifact yuklash
        uses: actions/upload-artifact@v4
        with:
          name: lunaris-${{ env.DEVICE }}-${{ github.run_number }}
          path: ${{ env.WORK_DIR }}/out/target/product/${{ env.DEVICE }}/*.zip
          retention-days: 7
